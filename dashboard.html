<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NodeAler</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8f8f8; }
        .header { background: linear-gradient(135deg, #002f34, #1a5f6a); color: white; padding: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header-container { max-width: 1280px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 28px; font-weight: bold; cursor: pointer; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #23e5db; }
        .main-container { max-width: 1280px; margin: 20px auto; padding: 0 16px; }
        .filters-section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .filter-input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .filter-input:focus { outline: none; border-color: #23e5db; box-shadow: 0 0 4px rgba(35, 229, 219, 0.3); }
        .listings-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .listing-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
        .listing-card:hover { transform: translateY(-4px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        .listing-image { width: 100%; height: 200px; background: linear-gradient(135deg, #ddd, #f5f5f5); display: flex; align-items: center; justify-content: center; font-size: 48px; }
        .listing-info { padding: 16px; }
        .listing-title { font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #002f34; }
        .listing-price { color: #23e5db; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .listing-location { color: #666; font-size: 13px; margin-bottom: 12px; }
        .listing-meta { display: flex; justify-content: space-between; font-size: 12px; color: #999; margin-bottom: 12px; }
        .btn { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; transition: all 0.3s; font-size: 14px; }
        .btn-primary { background: linear-gradient(135deg, #23e5db, #00bfa5); color: #002f34; }
        .btn-primary:hover { box-shadow: 0 4px 12px rgba(35, 229, 219, 0.3); }
        .btn-message { background: #002f34; color: white; width: 100%; }
        .btn-message:hover { background: #003d44; }
        @media (max-width: 768px) {
            .filter-row { grid-template-columns: 1fr; }
            .listings-container { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
            .header-container { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">🚀 NodeAler</a>
            <nav class="nav-links">
                <a href="dashboard.html">Browse</a>
                <a href="#">My Listings</a>
                <a href="#">Messages</a>
                <a href="index.html">Logout</a>
            </nav>
        </div>
    </header>
    <div class="main-container">
        <div class="filters-section">
            <h2 style="margin-bottom: 16px;">Search & Filter</h2>
            <div class="filter-row">
                <input type="text" class="filter-input" placeholder="Search by make/model" id="searchInput">
                <select class="filter-input" id="typeFilter">
                    <option value="">All Types</option>
                    <option value="car">Cars</option>
                    <option value="bike">Bikes</option>
                    <option value="truck">Trucks</option>
                </select>
                <select class="filter-input" id="priceFilter">
                    <option value="">All Prices</option>
                    <option value="0-500000">₹0 - ₹5 Lakhs</option>
                    <option value="500000-1000000">₹5L - ₹10L</option>
                    <option value="1000000-2000000">₹10L - ₹20L</option>
                    <option value="2000000+">₹20L+</option>
                </select>
                <select class="filter-input" id="locationFilter">
                    <option value="">All Locations</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="delhi">Delhi</option>
                    <option value="bangalore">Bangalore</option>
                </select>
                <button class="btn btn-primary" onclick="applyFilters()">Search</button>
            </div>
        </div>
        <div class="listings-container" id="listingsContainer">
            <!-- Listings will be populated here -->
        </div>
    </div>
    <script>
        const mockListings = [
            { id: 1, title: '2020 Toyota Fortuner', price: 28 00000, type: 'car', location: 'Mumbai', image: '🚗', seller: 'Rajesh K', rating: 4.8 },
            { id: 2, title: 'Hero Honda CB 150', price: 150000, type: 'bike', location: 'Delhi', image: '🏍️', seller: 'Amit P', rating: 4.5 },
            { id: 3, title: '2019 Hyundai Creta', price: 1100000, type: 'car', location: 'Bangalore', image: '🚙', seller: 'Priya S', rating: 4.9 },
            { id: 4, title: 'Royal Enfield Classic 350', price: 175000, type: 'bike', location: 'Mumbai', image: '🏍️', seller: 'Vikram M', rating: 4.7 },
            { id: 5, title: '2018 Mahindra XUV500', price: 950000, type: 'car', location: 'Mumbai', image: '🚗', seller: 'Neha R', rating: 4.6 },
            { id: 6, title: 'BMW S1000RR', price: 2000000, type: 'bike', location: 'Delhi', image: '🏍️', seller: 'Arjun K', rating: 4.8 }
        ];
        function renderListings(listings) {
            const container = document.getElementById('listingsContainer');
            container.innerHTML = listings.map(listing => `
                <div class="listing-card" onclick="viewDetails(${listing.id})">
                    <div class="listing-image">${listing.image}</div>
                    <div class="listing-info">
                        <div class="listing-title">${listing.title}</div>
                        <div class="listing-price">₹${(listing.price/100000).toFixed(1)}L</div>
                        <div class="listing-location">📍 ${listing.location}</div>
                        <div class="listing-meta">
                            <span>Seller: ${listing.seller}</span>
                            <span>⭐ ${listing.rating}</span>
                        </div>
                        <button class="btn btn-message">💬 Message Seller</button>
                    </div>
                </div>
            `).join('');
        }
        function applyFilters() { alert('Filters applied!'); }
        function viewDetails(id) { alert(`Viewing details for listing ${id}`); }
        window.addEventListener('DOMContentLoaded', () => renderListings(mockListings));
    </script>
</body>
</html>
